<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Redline — Music Player Prototype</title>
<meta name="description" content="Redline: a dark, content-first music streaming app prototype with carousels, a full-screen player and synced lyrics. All artists and artwork are fictional.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23C92000'/%3E%3Cpath d='M5 17h5l2.5-6 4 11 3-8 2 3H27' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ 1. Tokens ============ */
:root{
  --bg:#121212; --surface:#181818; --surface-2:#1f1f1f; --card:#252525; --card-2:#272727; --menu:#282828;
  --hover:rgba(255,255,255,.07); --hover-2:rgba(255,255,255,.1);
  --text:#fff; --text-soft:#cbcbcb; --muted:#b3b3b3; --dim:#7c7c7c;
  --border:#4d4d4d; --border-light:#7c7c7c;
  --accent:#C92000; --accent-hi:#E0290A; --accent-lo:#A31A00;
  --accent-text:#FF4D2E; /* tint of the accent, used only for small text on dark (AA contrast) */
  --neg:#f3727f; --warn:#ffa42b; --info:#539df5;
  --sh-heavy:rgba(0,0,0,.5) 0 8px 24px; --sh-med:rgba(0,0,0,.3) 0 8px 8px;
  --inset:rgb(18,18,18) 0 1px 0, rgb(124,124,124) 0 0 0 1px inset;
  --font:Inter,"Noto Sans Arabic","Noto Sans Hebrew","Noto Sans","Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  --ease:cubic-bezier(.3,0,0,1); --ease-out:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --sidebar-w:300px; --panel-w:340px; --player-h:88px; --gap:8px; --tb-h:64px;
  --hdr:#3a3a3a;
}

/* ============ 2. Base ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
h1,h2,h3,h4,p{margin:0}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:4px}
.i{width:24px;height:24px;fill:currentColor;flex:none;display:block}
.i-12{width:12px;height:12px}.i-16{width:16px;height:16px}.i-20{width:20px;height:20px}
.muted{color:var(--muted)}
.scroll{scrollbar-width:thin;scrollbar-color:transparent transparent}
.scroll:hover{scrollbar-color:rgba(255,255,255,.3) transparent}
.scroll::-webkit-scrollbar{width:12px;height:12px}
.scroll::-webkit-scrollbar-thumb{background-color:transparent;border:3px solid transparent;background-clip:padding-box;border-radius:8px}
.scroll:hover::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.3)}

/* ============ 3. App shell ============ */
.app{position:relative;display:grid;height:100vh;height:100dvh;padding:var(--gap);
  grid-template-columns:var(--sidebar-w) minmax(0,1fr) 0px;
  grid-template-rows:minmax(0,1fr) var(--player-h);
  grid-template-areas:"side main panel" "player player player";
  transition:grid-template-columns .5s var(--ease)}
.app.panel-open{grid-template-columns:var(--sidebar-w) minmax(0,1fr) calc(var(--panel-w) + var(--gap))}

/* ============ 4. Sidebar ============ */
.side{grid-area:side;display:flex;flex-direction:column;gap:var(--gap);min-height:0;margin-right:var(--gap)}
.side-top,.side-lib{background:var(--surface);border-radius:8px}
.side-top{padding:20px 12px 8px}
.brand{display:flex;align-items:center;gap:10px;padding:0 12px 16px;font-weight:800;font-size:22px;letter-spacing:-.6px}
.brand-mark{width:32px;height:32px;flex:none}
.brand-mark .ln{stroke-dasharray:44;stroke-dashoffset:0;transition:stroke-dashoffset .6s var(--ease)}
.brand:hover .brand-mark .ln{animation:draw 1s var(--ease) both}
.nav a{position:relative;display:flex;align-items:center;gap:16px;padding:10px 12px;border-radius:6px;color:var(--muted);font-weight:700;font-size:15px;transition:color .2s}
.nav a:hover{color:#fff}
.nav a.active{color:#fff}
.nav a::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent);transform:scaleY(0);transition:transform .3s var(--ease)}
.nav a.active::before{transform:scaleY(1)}
.nav .ic-home-fill,.nav .ic-search-bold{display:none}
.nav a.active .ic-home{display:none}.nav a.active .ic-home-fill{display:block}
.side-lib{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.lib-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px 24px}
.lib-title{display:flex;gap:14px;align-items:center;color:var(--muted);font-weight:700;font-size:15px;transition:color .2s}
.lib-title:hover,.lib-title.active{color:#fff}
.icon-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:color .2s,background .2s,transform .2s var(--ease)}
.icon-btn:hover{color:#fff;background:var(--surface-2);transform:scale(1.06)}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.lib-pills{padding:8px 16px 8px}
.pill{flex:none;padding:7px 14px;border-radius:9999px;background:var(--surface-2);font-size:14px;color:#fff;white-space:nowrap;transition:background .2s,color .2s,transform .2s var(--ease)}
.pill:hover{background:#2a2a2a}
.pill:active{transform:scale(.96)}
.pill.on{background:var(--accent);color:#fff}
.lib-list{flex:1;overflow-y:auto;padding:4px 8px 8px}
.lib-item{position:relative;display:flex;gap:12px;align-items:center;padding:8px;border-radius:6px;transition:background .2s;animation:rise .45s var(--ease-out) both;animation-delay:calc(var(--i,0) * 30ms)}
.no-anim .lib-item{animation:none}
.lib-item:hover{background:var(--hover)}
.lib-item.active{background:var(--hover-2)}
.lib-art{width:48px;height:48px;border-radius:4px;flex:none;background:var(--surface-2);object-fit:cover}
.lib-art.round{border-radius:50%}
.lib-text{min-width:0;flex:1}
.lib-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;transition:color .2s}
.lib-meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin{color:var(--accent-text);display:inline-flex}
.lib-now{color:var(--accent-text);opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s var(--spring)}
.lib-item.current .lib-name{color:var(--accent-text)}
.lib-item.current .lib-now{opacity:1;transform:none}

/* ============ 5. Main + top bar ============ */
.main{grid-area:main;position:relative;background:var(--surface);border-radius:8px;overflow:hidden;min-width:0}
.main-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:0 24px;height:var(--tb-h)}
.topbar-bg{position:absolute;inset:0;background:var(--hdr);opacity:var(--tb-o,0);transition:background-color .8s var(--ease);pointer-events:none}
.topbar-bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.5)}
.topbar>*:not(.topbar-bg){position:relative}
.tb-arrows{display:flex;gap:8px}
.tb-btn{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.7);display:grid;place-items:center;color:#fff;transition:transform .2s var(--ease),background .2s}
.tb-btn:hover{transform:scale(1.06);background:rgba(0,0,0,.85)}
.tb-brand{display:none;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.5px}
.tb-brand svg{width:28px;height:28px}
.tb-sticky{display:flex;align-items:center;gap:12px;min-width:0;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .3s,transform .3s var(--ease)}
.topbar.show-title .tb-sticky{opacity:1;transform:none;pointer-events:auto}
.tb-title{font-size:22px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;flex:0 1 400px;margin-left:auto;margin-right:auto}
.topbar.show-title .search{margin-left:auto;margin-right:0}
.search .s-ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;transition:color .2s}
.search input{width:100%;height:46px;padding:12px 44px 12px 48px;border-radius:500px;background:var(--surface-2);border:0;color:#fff;font:inherit;font-size:15px;box-shadow:var(--inset);transition:box-shadow .2s,background .2s;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:#8a8a8a}
.search input::-webkit-search-cancel-button{display:none}
.search input:hover{background:#2a2a2a;box-shadow:rgb(18,18,18) 0 1px 0,#9a9a9a 0 0 0 1px inset}
.search input:focus{outline:none;box-shadow:rgb(18,18,18) 0 1px 0,#fff 0 0 0 2px inset}
.search:focus-within .s-ic{color:#fff}
.search-clear{position:absolute;right:10px;top:50%;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transform:translateY(-50%) scale(.6);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--spring)}
.search.has-q .search-clear{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.search-clear:hover{color:#fff}
.tb-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.search+.tb-right{margin-left:0}
.avatar{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.7);display:grid;place-items:center;transition:transform .2s var(--ease)}
.avatar:hover{transform:scale(1.06)}
.avatar img{width:32px;height:32px;border-radius:50%}
.view{position:relative;min-height:calc(100% - var(--tb-h))}
.view.enter>*{animation:viewIn .5s var(--ease-out) both}
.hdr-glow{position:absolute;left:0;right:0;top:calc(var(--tb-h) * -1);height:440px;background:var(--hdr);opacity:.85;transition:background-color .8s var(--ease);pointer-events:none;
  -webkit-mask-image:linear-gradient(#000,rgba(0,0,0,.55) 45%,transparent);mask-image:linear-gradient(#000,rgba(0,0,0,.55) 45%,transparent)}
.view.enter>.hdr-glow{animation:none}
.view>*:not(.hdr-glow){position:relative}

/* ============ 6. Buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 32px;border-radius:500px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;line-height:1;white-space:nowrap;transition:transform .2s var(--ease),background .2s,border-color .2s,color .2s}
.btn:active{transform:scale(.97)!important}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:var(--accent-hi);transform:scale(1.04)}
.btn-outline{height:32px;padding:0 16px;font-size:12px;letter-spacing:1.4px;border:1px solid var(--border-light);color:#fff}
.btn-outline:hover{border-color:#fff;transform:scale(1.04)}
.btn-outline.lg{height:48px;padding:0 28px;font-size:13px}
.btn-outline.on{border-color:#fff}
.btn-light{background:#eee;color:#181818}
.btn-light:hover{transform:scale(1.04);background:#fff}
.play-btn{position:relative;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--sh-heavy);transition:transform .25s var(--ease),background .2s,opacity .3s}
.play-btn:hover{transform:scale(1.06);background:var(--accent-hi)}
.play-btn:active{transform:scale(.95)}
.play-btn.lg{width:56px;height:56px}
.play-btn.sm{width:40px;height:40px}
.play-btn .i{width:22px;height:22px}
.play-btn.lg .i{width:26px;height:26px}
.play-btn.sm .i{width:18px;height:18px}
.pp .ic-pause,.pp .lbl-pause{display:none}
.pp.is-playing .ic-play,.pp.is-playing .lbl-play{display:none}
.pp.is-playing .ic-pause,.pp.is-playing .lbl-pause{display:block}
.pp .i{animation:pop .3s var(--spring)}
.act-icon{position:relative;display:grid;place-items:center;color:var(--muted);transition:color .2s,transform .2s var(--ease)}
.act-icon:hover{color:#fff;transform:scale(1.06)}
.act-icon .i{width:32px;height:32px}
.act-icon.on{color:var(--accent-text)}
/* heart toggles */
[data-like] .ic-heart-fill,[data-save] .ic-heart-fill{display:none}
[data-like].on .ic-heart,[data-save].on .ic-heart{display:none}
[data-like].on .ic-heart-fill,[data-save].on .ic-heart-fill{display:block;color:var(--accent-text)}
[data-like].pop .i,[data-save].pop .i{animation:heart .5s var(--spring)}
[data-like]::after,[data-save]::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent-text);opacity:0;transform:scale(.4);pointer-events:none}
[data-like].pop::after,[data-save].pop::after{animation:ring .5s var(--ease-out)}

/* ============ 7. Home: greeting, hero carousel, quick picks ============ */
.greet-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:8px 24px 16px}
.greet{font-size:32px;font-weight:800;letter-spacing:-.8px}
.hero{position:relative;margin:0 24px 28px;height:344px;border-radius:12px;overflow:hidden;box-shadow:var(--sh-heavy);isolation:isolate;touch-action:pan-y;background:#0d0d0d}
.hero-slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:center;gap:24px;padding:28px 40px 60px;opacity:0;visibility:hidden;transition:opacity .9s var(--ease),visibility .9s}
.hero-slide.on{opacity:1;visibility:visible}
.hero-bg{position:absolute;inset:-60px;z-index:-2;background-size:cover;background-position:center;filter:blur(36px) saturate(1.5) brightness(.55);transform:scale(1.2);transition:transform 7s linear}
.hero-slide.on .hero-bg{transform:scale(1)}
.hero-slide::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.15) 70%)}
.hero-copy>*{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .7s var(--ease-out)}
.hero-slide.on .hero-copy>*{opacity:1;transform:none}
.hero-slide.on .hero-copy>:nth-child(2){transition-delay:.08s}
.hero-slide.on .hero-copy>:nth-child(3){transition-delay:.16s}
.hero-slide.on .hero-copy>:nth-child(4){transition-delay:.24s}
.hero-eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.hero-eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
.hero-title{font-size:clamp(32px,4.2vw,56px);font-weight:900;letter-spacing:-1.6px;line-height:1;margin:14px 0 10px}
.hero-desc{color:var(--text-soft);font-size:15px;line-height:1.45;max-width:440px}
.hero-desc b{color:#fff}
.hero-actions{display:flex;gap:12px;align-items:center;margin-top:22px;flex-wrap:wrap}
.hero-visual{position:relative;justify-self:center;width:min(230px,26vw);aspect-ratio:1}
.hero-cover{position:relative;z-index:2;width:100%;height:100%;border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.6);transform:rotate(-6deg) translateX(40px) scale(.85);opacity:0;transition:transform 1s var(--spring),opacity .6s}
.hero-slide.on .hero-cover{transform:rotate(-3deg);opacity:1}
.hero-vinyl{position:absolute;inset:4%;z-index:1;transform:translateX(0);transition:transform 1.1s var(--ease-out) .35s}
.hero-slide.on .hero-vinyl{transform:translateX(40%)}
.disc{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.6);
  background:radial-gradient(circle,transparent 0 31%,rgba(255,255,255,.06) 31.5% 32%,transparent 32.5%),repeating-radial-gradient(circle,#111 0 1.5px,#1b1b1b 1.5px 3px);animation:spin 6s linear infinite}
.disc::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 10%,rgba(255,255,255,.12) 14%,transparent 20% 60%,rgba(255,255,255,.08) 64%,transparent 70%)}
.disc img{width:34%;height:34%;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #0c0c0c}
.hero-dots{position:absolute;left:40px;bottom:20px;display:flex;gap:8px;z-index:5}
.hero-dot{position:relative;width:24px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden;transition:width .4s var(--ease)}
.hero-dot::before{content:"";position:absolute;inset:-10px 0}
.hero-dot.on{width:48px}
.hero-dot i{position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(var(--f,0))}
.hero-nav{position:absolute;right:20px;bottom:16px;display:flex;gap:8px;z-index:5}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 12px;padding:0 24px;margin-bottom:36px}
.qp{position:relative;display:flex;align-items:center;gap:12px;height:64px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;cursor:pointer;transition:background .3s;animation:rise .5s var(--ease-out) both;animation-delay:calc(var(--i,0) * 40ms)}
.qp:hover{background:rgba(255,255,255,.16)}
.qp img{width:64px;height:64px;flex:none;box-shadow:rgba(0,0,0,.5) 0 0 12px;object-fit:cover}
.qp img.round{border-radius:50%;width:48px;height:48px;margin-left:8px}
.qp-name{flex:1;min-width:0;font-weight:700;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qp .play-btn{width:36px;height:36px;margin-right:12px;opacity:0;transform:scale(.8);box-shadow:var(--sh-med)}
.qp .play-btn .i{width:16px;height:16px}
.qp:hover .play-btn,.qp .play-btn.is-playing{opacity:1;transform:none}
.qp .eq{display:none;margin-right:16px}
.qp.current .qp-name{color:var(--accent-text)}

/* ============ 8. Shelves & cards ============ */
.shelf{margin:0 0 28px}
.shelf-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:0 24px;margin-bottom:8px}
.shelf-sub{font-size:13px;color:var(--muted);margin-bottom:4px}
.shelf-title{font-size:24px;font-weight:700;letter-spacing:-.4px}
.shelf-ctrl{display:flex;gap:8px;align-items:center;flex:none}
.show-all{font-size:14px;font-weight:700;color:var(--muted);margin-right:6px;transition:color .2s}
.show-all:hover{color:#fff;text-decoration:underline}
.arrow{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:#fff;transition:background .2s,transform .2s var(--ease),opacity .2s}
.arrow:hover:not(:disabled){background:var(--card);transform:scale(1.08)}
.arrow:disabled{opacity:.3;cursor:default}
.hero .arrow{background:rgba(0,0,0,.5)}
.track{--fl:0px;--fr:48px;display:grid;grid-auto-flow:column;grid-auto-columns:clamp(156px,15vw,204px);overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 12px;padding:0 12px 4px;scrollbar-width:none;overscroll-behavior-x:contain;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent)}
.track::-webkit-scrollbar{display:none}
.track>*{scroll-snap-align:start}
.card{position:relative;padding:12px;border-radius:8px;cursor:pointer;transition:background .3s var(--ease);animation:rise .6s var(--ease-out) both;animation-delay:calc(var(--i,0) * 45ms)}
.card:hover{background:var(--card)}
.card-media{position:relative;margin-bottom:12px}
.card-art{aspect-ratio:1;border-radius:6px;overflow:hidden;box-shadow:var(--sh-med);background:var(--surface-2)}
.card-art img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.card:hover .card-art img{transform:scale(1.05)}
.card.round .card-art{border-radius:50%}
.card .play-btn{position:absolute;right:8px;bottom:8px;opacity:0;transform:translateY(8px)}
.card:hover .play-btn,.card:focus-within .play-btn,.card .play-btn.is-playing{opacity:1;transform:none}
.card .play-btn:hover{transform:scale(1.06)}
.card-title{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.card.current .card-title{color:var(--accent-text)}
.card-sub{font-size:14px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-sub a:hover{color:#fff;text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));padding:0 12px 32px}
.card.hide{display:none}

/* ============ 9. Page headers (album / playlist / artist) ============ */
.phead{display:flex;align-items:flex-end;gap:24px;padding:16px 24px 24px;min-height:300px}
.phead-art{width:clamp(160px,17vw,232px);aspect-ratio:1;border-radius:6px;box-shadow:var(--sh-heavy);flex:none;object-fit:cover;animation:artIn .8s var(--ease-out) both}
.phead-info{min-width:0;animation:rise .6s var(--ease-out) .1s both}
.phead-type{font-size:14px;font-weight:600}
.phead-title{font-size:clamp(36px,6vw,88px);font-weight:900;letter-spacing:-2px;line-height:1.02;margin:8px 0 18px;overflow-wrap:anywhere}
.phead-title.long{font-size:clamp(32px,4.4vw,64px)}
.phead-desc{color:var(--muted);font-size:14px;margin:-6px 0 12px;line-height:1.45;max-width:640px}
.phead-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--text-soft)}
.phead-meta b{color:#fff}
.phead-meta a:hover b{text-decoration:underline}
.mini-av{width:24px;height:24px;border-radius:50%}
.sep{color:var(--muted)}
.pbody{position:relative;background:linear-gradient(rgba(0,0,0,.28),transparent 240px);padding-bottom:24px;min-height:300px}
.actions{display:flex;align-items:center;gap:24px;padding:24px}
.ahead{position:relative;height:clamp(300px,42vh,420px);display:flex;align-items:flex-end;padding:24px;margin-top:calc(var(--tb-h) * -1);overflow:hidden}
.ahead-img{position:absolute;inset:0;background-size:cover;background-position:right center;transform-origin:right center;animation:kenburns 24s ease-in-out infinite alternate}
.ahead::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.65))}
.ahead-info{position:relative;z-index:1;animation:rise .7s var(--ease-out) .1s both}
.verified{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.verified .i{color:var(--info);width:24px;height:24px}
.ahead-name{font-size:clamp(48px,8vw,96px);font-weight:900;letter-spacing:-3px;line-height:1;margin:8px 0 16px}
.ahead-listeners{font-size:16px;color:var(--text-soft)}
.sec-title{font-size:24px;font-weight:700;letter-spacing:-.4px;padding:0 24px;margin:8px 0 14px}
.see-more{margin:8px 0 32px 40px;color:var(--muted);font-weight:700;font-size:14px;transition:color .2s}
.see-more:hover{color:#fff}
.about{position:relative;margin:0 24px 36px;max-width:820px;height:420px;border-radius:8px;overflow:hidden;cursor:default}
.about-img{position:absolute;inset:0;background-size:cover;background-position:right center;transition:transform 1s var(--ease)}
.about:hover .about-img{transform:scale(1.03)}
.about::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.85))}
.about-body{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:32px 40px}
.rank{position:absolute;top:24px;left:24px;z-index:1;width:92px;height:92px;border-radius:50%;background:var(--info);display:grid;place-items:center;text-align:center;font-weight:800;font-size:13px;line-height:1.15;transform:rotate(-8deg);box-shadow:var(--sh-heavy)}
.rank b{display:block;font-size:24px}
.about-body .big{font-size:18px;font-weight:700;margin-bottom:10px}
.about-body p{font-size:16px;line-height:1.5;color:var(--text-soft);max-width:600px}
.copy{color:var(--muted);font-size:12px;padding:24px 40px 32px}
.empty{padding:64px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty .i{width:56px;height:56px;color:var(--muted)}
.empty h2{font-size:24px;font-weight:700}
.empty p{color:var(--muted);max-width:420px;line-height:1.5}

/* ============ 10. Track list ============ */
.tl{padding:0 24px}
.tl-head,.tr{display:grid;grid-template-columns:32px minmax(0,4fr) minmax(0,2fr) 128px;gap:16px;align-items:center;padding:0 16px}
.tl.c3 .tl-head,.tl.c3 .tr{grid-template-columns:32px minmax(0,1fr) 128px}
.tl.plays .tl-head,.tl.plays .tr{grid-template-columns:32px minmax(0,4fr) minmax(0,1.4fr) 128px}
.tl-head{height:36px;color:var(--muted);font-size:13px;box-shadow:0 1px 0 rgba(255,255,255,.1);margin-bottom:12px}
.tl-head .r{display:flex;justify-content:flex-end;padding-right:36px}
.tr{height:56px;border-radius:6px;color:var(--muted);font-size:14px;cursor:pointer;transition:background .15s,opacity .3s,transform .3s;animation:rise .45s var(--ease-out) both;animation-delay:calc(var(--i,0) * 28ms)}
.tr:hover{background:var(--hover-2)}
.tr.leaving{opacity:0;transform:translateX(-12px)}
.tr-num{position:relative;display:flex;justify-content:center;align-items:center;font-size:16px;font-variant-numeric:tabular-nums}
.tr-play{display:none;color:#fff}
.tr:hover .n{display:none}.tr:hover .tr-play{display:block}
.tr.playing .n{display:none}.tr.playing .eq{display:flex}
.tr.playing:hover .eq{display:none}
.tr-main{display:flex;align-items:center;gap:12px;min-width:0}
.tr-main img{width:40px;height:40px;border-radius:4px;flex:none}
.tr-text{min-width:0}
.tr-title{color:#fff;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;transition:color .2s}
.tr.playing .tr-title{color:var(--accent-text)}
.tr-artist{display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-artist a:hover,.tr-album:hover{color:#fff;text-decoration:underline}
.tr-album,.tr-plays{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tr-end{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.tr-like,.tr-more{position:relative;display:grid;place-items:center;color:var(--muted);opacity:0;transition:opacity .2s,color .2s,transform .2s var(--ease)}
.tr-like:hover,.tr-more:hover{color:#fff;transform:scale(1.1)}
.tr:hover .tr-like,.tr:hover .tr-more,.tr-like.on{opacity:1}
.tr-dur{min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.explicit{display:inline-grid;place-items:center;flex:none;width:16px;height:16px;border-radius:2px;background:var(--muted);color:#121212;font-size:10.5px;font-weight:600;line-height:1.33;margin-right:6px}
.tl .more-row{display:none}
.tl.expanded .more-row{display:grid}
.eq{display:none;align-items:flex-end;justify-content:center;gap:2px;width:14px;height:14px}
.eq i{width:3px;height:100%;border-radius:1px;background:var(--accent-text);transform-origin:bottom;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-duration:.7s;animation-delay:-.4s}
.eq i:nth-child(3){animation-duration:1.1s;animation-delay:-.2s}
.eq i:nth-child(4){animation-duration:.8s;animation-delay:-.6s}
body:not(.is-playing) .eq i{animation-play-state:paused}
.qp.current .eq{display:flex}
.qp.current:hover .eq{display:none}

/* ============ 11. Search & library ============ */
.page-title{font-size:32px;font-weight:800;letter-spacing:-.8px;padding:8px 24px 16px}
.browse{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;padding:0 24px 40px}
.genre{display:flex;align-items:flex-start;justify-content:flex-start;text-align:left;width:100%;color:#fff;position:relative;aspect-ratio:1.55;border-radius:8px;overflow:hidden;padding:16px;font-size:22px;font-weight:800;letter-spacing:-.4px;cursor:pointer;background:var(--c);animation:rise .55s var(--ease-out) both;animation-delay:calc(var(--i,0) * 35ms);transition:transform .3s var(--ease)}
.genre:hover{transform:translateY(-3px)}
.genre span{position:relative;z-index:1;max-width:70%;line-height:1.15}
.genre img{position:absolute;width:44%;right:-6%;bottom:-6%;border-radius:4px;transform:rotate(25deg);box-shadow:var(--sh-med);transition:transform .45s var(--spring)}
.genre:hover img{transform:rotate(16deg) scale(1.08) translate(-6px,-8px)}
.sres-pills{padding:0 24px 20px}
.results{display:grid;grid-template-columns:minmax(260px,2fr) minmax(0,3fr);gap:24px;padding:0 24px 28px}
.results .sec-title,.results .tl{padding:0}
.top-result{position:relative;display:block;background:rgba(255,255,255,.04);border-radius:8px;padding:20px;cursor:pointer;transition:background .3s;animation:rise .5s var(--ease-out) both}
.top-result:hover{background:var(--card)}
.top-result img{width:92px;height:92px;border-radius:6px;box-shadow:var(--sh-heavy)}
.top-result img.round{border-radius:50%}
.top-result h3{font-size:32px;font-weight:800;letter-spacing:-.8px;margin:20px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-result p{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.tag{display:inline-block;background:#121212;color:#fff;padding:4px 12px;border-radius:9999px;font-size:13px;font-weight:700}
.top-result .play-btn{position:absolute;right:20px;bottom:20px;opacity:0;transform:translateY(8px)}
.top-result:hover .play-btn,.top-result .play-btn.is-playing{opacity:1;transform:none}
.results .tr{grid-template-columns:minmax(0,1fr) 128px!important;padding:0 8px}
.results .tr-num{display:none}
.sres[hidden]{display:none}
.site-foot{padding:32px 24px 48px;margin-top:24px;color:var(--muted);font-size:14px}
.foot-cols{display:flex;flex-wrap:wrap;gap:24px 72px;margin-bottom:28px}
.foot-cols h4{color:#fff;font-size:16px;font-weight:700;margin-bottom:10px}
.foot-cols span{display:block;margin:8px 0;cursor:pointer;transition:color .2s}
.foot-cols span:hover{color:#fff;text-decoration:underline}
.site-foot .rule{height:1px;background:rgba(255,255,255,.1);margin-bottom:24px}
.site-foot p{line-height:1.5}

/* ============ 12. Player bar ============ */
.player{grid-area:player;position:relative;display:grid;grid-template-columns:minmax(180px,1fr) minmax(0,1.6fr) minmax(180px,1fr);align-items:center;gap:16px;padding:0 8px}
.np{display:flex;align-items:center;gap:14px;min-width:0}
.np-art{position:relative;width:56px;height:56px;border-radius:4px;overflow:hidden;flex:none;box-shadow:var(--sh-med)}
.np-art img{width:100%;height:100%;object-fit:cover}
.np-expand{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.75);display:grid;place-items:center;opacity:0;transform:scale(.7);transition:opacity .2s,transform .25s var(--spring)}
.np-art:hover .np-expand{opacity:1;transform:none}
.np-text{min-width:0}
.np-title,.np-artist{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-title{font-size:14px;font-weight:600;margin-bottom:4px}
.np-artist{font-size:12px;color:var(--muted)}
.np-title:hover,.np-artist:hover{text-decoration:underline;color:#fff}
.np.swap .np-art,.np.swap .np-text{animation:swapIn .5s var(--ease-out)}
.np-like .i{width:20px;height:20px}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:720px;justify-self:center}
.ctrl-btns{display:flex;align-items:center;gap:18px}
.cbtn{position:relative;width:32px;height:32px;display:grid;place-items:center;color:var(--muted);transition:color .2s,transform .2s var(--ease)}
.cbtn .i{width:20px;height:20px}
.cbtn:hover{color:#fff;transform:scale(1.08)}
.cbtn:active{transform:scale(.94)}
.cbtn.on{color:var(--accent-text)}
.cbtn.on::after{content:"";position:absolute;bottom:-3px;left:50%;width:4px;height:4px;border-radius:50%;background:currentColor;transform:translateX(-50%)}
.rep1{position:absolute;top:2px;right:0;min-width:12px;height:12px;border-radius:6px;background:var(--accent);color:#fff;font-size:8px;font-weight:800;display:none;place-items:center}
.cbtn.one .rep1{display:grid}
.main-play{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;transition:transform .2s var(--ease),background .2s}
.main-play:hover{transform:scale(1.08);background:var(--accent-hi)}
.main-play:active{transform:scale(.94)}
.main-play .i{width:18px;height:18px}
.prog{display:flex;align-items:center;gap:8px;width:100%;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog time{min-width:40px;text-align:right}
.prog time:last-child{text-align:left}
.bar{--p:0;position:relative;flex:1;height:16px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.bar-track{position:relative;width:100%;height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.bar-fill{position:absolute;inset:0;background:#fff;border-radius:2px;transform-origin:left;transform:scaleX(var(--p))}
.bar:hover .bar-fill,.bar.drag .bar-fill,.bar:focus-visible .bar-fill{background:var(--accent)}
.bar-thumb{position:absolute;left:calc(var(--p) * 100%);top:50%;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:var(--sh-med);transform:translate(-50%,-50%) scale(0);transition:transform .15s var(--ease)}
.bar:hover .bar-thumb,.bar.drag .bar-thumb,.bar:focus-visible .bar-thumb{transform:translate(-50%,-50%) scale(1)}
.bar:focus-visible{outline:none}
.extra{display:flex;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.vol{display:flex;align-items:center;gap:2px}
.vol .bar{width:96px;flex:none}
.mini-prog{display:none}

/* ============ 13. Now-playing panel ============ */
.panel-wrap{grid-area:panel;min-width:0;overflow:hidden;padding-left:var(--gap)}
.panel{width:var(--panel-w);height:100%;background:var(--surface);border-radius:8px;overflow-y:auto}
.panel-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 12px 12px 16px;background:var(--surface)}
.panel-head>a{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-head>a:hover{text-decoration:underline}
.panel-head>div{display:flex}
.panel-art{margin:4px 16px 0;aspect-ratio:1;border-radius:8px;overflow:hidden;box-shadow:var(--sh-heavy)}
.panel-art img{width:100%;height:100%;object-fit:cover;animation:artIn .7s var(--ease-out)}
.panel-meta{display:flex;align-items:center;gap:12px;padding:18px 16px 4px}
.panel-meta>div{flex:1;min-width:0}
.panel-title{display:block;font-size:24px;font-weight:700;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.panel-artist{color:var(--muted);font-size:16px}
.panel-title:hover,.panel-artist:hover{text-decoration:underline;color:#fff}
.panel-meta .act-icon .i{width:24px;height:24px}
.panel-card{margin:16px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.ac-img{height:200px;background-size:cover;background-position:right center;padding:16px;font-weight:700;position:relative}
.ac-img::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),transparent 50%)}
.ac-img span{position:relative;z-index:1}
.ac-body{padding:16px}
.ac-body b{font-size:16px}
.ac-row{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin:10px 0 12px}
.ac-body p{color:var(--muted);font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qc{padding:16px 8px 8px}
.qc-head{display:flex;justify-content:space-between;align-items:center;padding:0 8px 8px}
.qc-head button{font-size:14px;font-weight:700;color:var(--muted)}
.qc-head button:hover{color:#fff;text-decoration:underline}
.qc.flash{animation:flash 1.2s var(--ease)}
.q-item{display:flex;align-items:center;gap:12px;padding:8px;border-radius:6px;cursor:pointer;transition:background .2s}
.q-item:hover{background:var(--hover-2)}
.q-item img{width:48px;height:48px;border-radius:4px}
.q-item div{min-width:0}
.q-title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.q-artist{font-size:13px;color:var(--muted)}

/* ============ 14. Full-screen player ============ */
.fs{position:fixed;inset:0;z-index:100;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#0e0e0e;isolation:isolate;overflow:hidden;transform:translateY(100%);visibility:hidden;transition:transform .65s var(--ease-out),visibility .65s}
.fs.open{transform:none;visibility:visible}
.fs.dragging{transition:none}
.fs-bg{position:absolute;inset:0;z-index:-1;overflow:hidden}
.fs-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.6))}
.blob{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);opacity:.6;transition:background-color 1.2s var(--ease);animation:drift 18s ease-in-out infinite alternate}
.blob:nth-child(1){background:var(--c1,#5a1a10);top:-25%;left:-15%}
.blob:nth-child(2){background:var(--c2,#20203a);bottom:-35%;right:-15%;animation-duration:23s;animation-delay:-6s}
.blob:nth-child(3){background:var(--c3,#2a2a2a);top:25%;left:35%;width:42vmax;height:42vmax;animation-duration:27s;animation-delay:-12s}
.fs-top{display:flex;justify-content:space-between;align-items:center;padding:20px 32px;touch-action:none}
.fs-top .tb-btn{background:rgba(0,0,0,.35)}
.fs-from{text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;color:rgba(255,255,255,.7)}
.fs-from b{display:block;color:#fff;font-size:14px;text-transform:none;letter-spacing:0;margin-top:3px}
.fs-body{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:6vw;padding:0 7vw;min-height:0}
.fs-visual{position:relative;justify-self:end;width:min(46vh,420px);aspect-ratio:1;margin-right:12%;touch-action:none}
.fs-cover{position:relative;z-index:2;width:100%;height:100%;border-radius:8px;object-fit:cover;box-shadow:0 30px 70px rgba(0,0,0,.6);transform:scale(.9);transition:transform .7s var(--spring)}
body.is-playing .fs-cover{transform:none}
.fs-vinyl{position:absolute;inset:3%;z-index:1;transition:transform 1s var(--ease-out)}
body.is-playing .fs-vinyl{transform:translateX(36%)}
.fs-vinyl .disc{animation-duration:4s}
body:not(.is-playing) .disc{animation-play-state:paused}
.hero .disc{animation-play-state:running!important}
.fs-lyrics{position:relative;height:min(58vh,540px);overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 78%,transparent)}
.ly-inner{position:relative;padding:22vh 0;transition:transform .7s var(--ease-out)}
.ly{font-size:clamp(20px,2.4vw,32px);font-weight:800;letter-spacing:-.5px;line-height:1.25;color:rgba(255,255,255,.32);margin:0 0 18px;cursor:pointer;transform-origin:left center;transition:color .4s,transform .5s var(--ease-out),filter .4s;filter:blur(.4px)}
.ly:hover{color:rgba(255,255,255,.7)}
.ly.past{color:rgba(255,255,255,.55);filter:none}
.ly.now{color:#fff;transform:scale(1.04);filter:none}
.ly-empty{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:800;color:rgba(255,255,255,.6)}
.fs-bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);align-items:center;gap:32px;padding:12px 7vw 36px}
.fs-meta{display:flex;align-items:center;gap:16px;min-width:0}
.fs-meta>div{min-width:0}
.fs-meta h2{font-size:24px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-meta a{color:rgba(255,255,255,.75);font-size:15px}
.fs-meta a:hover{color:#fff;text-decoration:underline}
.fs-ctrl{display:flex;flex-direction:column-reverse;align-items:center;gap:10px}
.fs-ctrl .ctrl-btns{gap:28px}
.fs-ctrl .cbtn{color:rgba(255,255,255,.75)}
.fs-ctrl .cbtn .i{width:24px;height:24px}
.fs-ctrl .cbtn.on{color:var(--accent-text)}
.fs-ctrl .main-play{width:56px;height:56px;box-shadow:var(--sh-heavy)}
.fs-ctrl .main-play .i{width:24px;height:24px}
.fs .prog{color:rgba(255,255,255,.75)}
.fs .bar-track{background:rgba(255,255,255,.25)}
.viz{display:flex;align-items:flex-end;justify-content:flex-end;gap:3px;height:44px}
.viz i{width:4px;height:100%;border-radius:2px;background:rgba(255,255,255,.55);transform-origin:bottom;transform:scaleY(.06)}

/* ============ 15. Menu, toast, splash, tab bar ============ */
.menu{position:fixed;z-index:160;width:260px;background:var(--menu);border-radius:8px;padding:4px;box-shadow:var(--sh-heavy);opacity:0;transform:scale(.96) translateY(-6px);transform-origin:top left;pointer-events:none;visibility:hidden;transition:opacity .15s,transform .2s var(--ease-out),visibility .2s}
.menu.open{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.menu-head{display:flex;gap:10px;align-items:center;padding:8px 10px 10px;min-width:0}

.menu-head b,.menu-head span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-head b{font-size:14px}
.menu-head span{font-size:12px;color:var(--muted)}
.menu button,.menu a{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:4px;font-size:14px;color:#e6e6e6;text-align:left}
.menu button:hover,.menu a:hover{background:rgba(255,255,255,.1);color:#fff}
.menu .red{color:var(--accent-text)}
.menu hr{border:0;height:1px;background:rgba(255,255,255,.1);margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(var(--player-h) + 24px);z-index:170;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);background:#eee;color:#181818;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;box-shadow:var(--sh-heavy);opacity:0;transform:translate(-50%,16px) scale(.96);pointer-events:none;transition:opacity .25s,transform .35s var(--spring)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .i{color:var(--accent)}
.splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:var(--bg);transition:opacity .6s var(--ease),visibility .6s}
.splash.done{opacity:0;visibility:hidden}
.splash-inner{display:flex;align-items:center;gap:14px;font-size:40px;font-weight:900;letter-spacing:-1.4px}
.splash-inner svg{width:56px;height:56px;animation:popIn .7s var(--spring) both}
.splash-inner span{animation:rise .7s var(--ease-out) .15s both}
.splash .ln{stroke-dasharray:44;stroke-dashoffset:44;animation:draw 1s var(--ease) .25s forwards}
.tabbar{display:none}

/* ============ 16. Keyframes ============ */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes artIn{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.4) rotate(-30deg)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.6);opacity:.4}to{transform:none;opacity:1}}
@keyframes heart{0%{transform:scale(1)}30%{transform:scale(1.4)}60%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes ring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.5)}}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,32,0,.7)}70%{box-shadow:0 0 0 10px rgba(201,32,0,0)}100%{box-shadow:0 0 0 0 rgba(201,32,0,0)}}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(12%,10%) scale(1.2)}}
@keyframes kenburns{from{transform:scale(1.04)}to{transform:scale(1.16) translateY(-2%)}}
@keyframes swapIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:44}to{stroke-dashoffset:0}}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 0 2px var(--accent)}}

<script>
'use strict';
/* =====================================================================
   Utilities
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ic = (n, c = '') => `<svg class="i ic-${n} ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const nf = n => n.toLocaleString('en-US');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) {
  let a = typeof seed === 'number' ? seed : hash(String(seed));
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), f = c => Math.round(c * (1 - amt));
  return '#' + ((1 << 24) | (f(n >> 16 & 255) << 16) | (f(n >> 8 & 255) << 8) | f(n & 255)).toString(16).slice(1);
}
const durText = s => { const m = Math.round(s / 60); return m >= 60 ? `${Math.floor(m / 60)} hr ${m % 60} min` : `${m} min`; };

/* =====================================================================
   Generative artwork — every cover & portrait is drawn in code (SVG)
   ===================================================================== */
const PAL = [
  ['#1b1f3b', '#53354a', '#e84545', '#ffb26b', '#f6e9e9'], // 0 dusk
  ['#0f3057', '#00587a', '#008891', '#e7e7de', '#ffd56b'], // 1 teal
  ['#2d132c', '#801336', '#c72c41', '#ee4540', '#f6d6ad'], // 2 wine
  ['#1a1a2e', '#16213e', '#0f3460', '#e94560', '#f5f5f5'], // 3 navy pink
  ['#283618', '#606c38', '#dda15e', '#bc6c25', '#fefae0'], // 4 olive
  ['#03045e', '#0077b6', '#00b4d8', '#90e0ef', '#caf0f8'], // 5 ocean
  ['#3c096c', '#7b2cbf', '#c77dff', '#ff9e00', '#ffe8d6'], // 6 violet
  ['#10002b', '#240046', '#5a189a', '#e0aaff', '#ff6d00'], // 7 deep purple
  ['#003049', '#d62828', '#f77f00', '#fcbf49', '#eae2b7'], // 8 sunset
  ['#264653', '#2a9d8f', '#e9c46a', '#f4a261', '#e76f51'], // 9 earth
  ['#0b090a', '#161a1d', '#660708', '#a4161a', '#f5f3f4'], // 10 noir
  ['#22223b', '#4a4e69', '#9a8c98', '#c9ada7', '#f2e9e4'], // 11 dusty
  ['#081c15', '#1b4332', '#2d6a4f', '#95d5b2', '#d8f3dc'], // 12 forest
  ['#370617', '#6a040f', '#dc2f02', '#f48c06', '#ffba08'], // 13 fire
  ['#012a4a', '#2c7da0', '#a9d6e5', '#ff5d8f', '#fff0f3'], // 14 candy
  ['#1f1300', '#5a3e1b', '#c08552', '#f3e9dc', '#895737'], // 15 coffee
];
const FONT = 'Inter,Helvetica Neue,Helvetica,Arial,sans-serif';
const MARK = `<g transform="translate(18 18) scale(.75)"><circle cx="16" cy="16" r="16" fill="#C92000"/><path d="M5 17h5l2.5-6 4 11 3-8 2 3H27" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>`;
const artCache = new Map();
const memo = (k, f) => { if (!artCache.has(k)) artCache.set(k, toURL(f())); return artCache.get(k); };
const toURL = svg => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg).replace(/'/g, '%27').replace(/\(/g, '%28').replace(/\)/g, '%29');
const svgDoc = (defs, body, grain = .3, W = 300) =>
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} 300" width="${W}" height="300"><defs>` +
  `<filter id="g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>` +
  `<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>${defs}</defs>` +
  `${body}<rect width="${W}" height="300" filter="url(#g)" opacity="${grain}" style="mix-blend-mode:overlay"/></svg>`;
const n0 = v => v.toFixed(0), n1 = v => v.toFixed(1);

const STYLES = {
  mesh(r, p) {
    let b = `<rect width="300" height="300" fill="${p[0]}"/><g filter="url(#b)">`;
    for (let i = 0; i < 6; i++) b += `<circle cx="${n0(r() * 300)}" cy="${n0(r() * 300)}" r="${n0(60 + r() * 90)}" fill="${p[1 + i % 4]}" opacity="${(.65 + r() * .35).toFixed(2)}"/>`;
    return ['', b + '</g>'];
  },
  orbs(r, p) {
    let d = `<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient>`;
    let b = `<rect width="300" height="300" fill="url(#bg)"/>`;
    const n = 2 + Math.floor(r() * 2);
    for (let i = 0; i < n; i++) {
      d += `<radialGradient id="o${i}" cx=".32" cy=".28" r=".8"><stop offset="0" stop-color="${p[4]}"/><stop offset=".35" stop-color="${p[2 + i % 3]}"/><stop offset="1" stop-color="${p[0]}"/></radialGradient>`;
      const R = 40 + r() * 70;
      b += `<circle cx="${n0(R + r() * (300 - 2 * R))}" cy="${n0(R + r() * (300 - 2 * R))}" r="${n0(R)}" fill="url(#o${i})"/>`;
    }
    b += `<circle cx="${n0(80 + r() * 140)}" cy="${n0(80 + r() * 140)}" r="${n0(90 + r() * 40)}" fill="none" stroke="${p[4]}" stroke-opacity=".35" stroke-width="1.5"/>`;
    return [d, b];
  },
  waves(r, p) {
    let b = `<rect width="300" height="300" fill="${p[0]}"/>`;
    const n = 6 + Math.floor(r() * 3);
    for (let i = 0; i < n; i++) {
      const y = 40 + i * (240 / n), a = 8 + r() * 22, f = 1 + r() * 2, ph = r() * 6.283;
      let d = `M0 300L0 ${n1(y + Math.sin(ph) * a)}`;
      for (let x = 10; x <= 300; x += 10) d += `L${x} ${n1(y + Math.sin(x / 300 * f * 6.283 + ph) * a)}`;
      b += `<path d="${d}L300 300Z" fill="${p[1 + i % 4]}"/>`;
    }
    return ['', b];
  },
  bauhaus(r, p) {
    let b = '';
    const pk = () => p[Math.floor(r() * 5)];
    for (let gy = 0; gy < 3; gy++) for (let gx = 0; gx < 3; gx++) {
      const x = gx * 100, y = gy * 100, bg = pk(), cx = x + 50, cy = y + 50, rot = Math.floor(r() * 4) * 90;
      let fg = pk(); if (fg === bg) fg = p[(p.indexOf(bg) + 2) % 5];
      b += `<rect x="${x}" y="${y}" width="100" height="100" fill="${bg}"/><g transform="rotate(${rot} ${cx} ${cy})" fill="${fg}">`;
      switch (Math.floor(r() * 6)) {
        case 0: b += `<path d="M${x} ${y}H${x + 100}A100 100 0 0 1 ${x} ${y + 100}Z"/>`; break;
        case 1: b += `<circle cx="${cx}" cy="${cy}" r="38"/>`; break;
        case 2: b += `<path d="M${x} ${cy}A50 50 0 0 1 ${x + 100} ${cy}Z"/>`; break;
        case 3: b += `<path d="M${x} ${y + 100}L${cx} ${y}L${x + 100} ${y + 100}Z"/>`; break;
        case 4: b += `<circle cx="${cx}" cy="${cy}" r="34" fill="none" stroke="${fg}" stroke-width="12"/><circle cx="${cx}" cy="${cy}" r="10"/>`; break;
        default: for (let k = 0; k < 5; k++) b += `<rect x="${x}" y="${y + k * 20 + 5}" width="100" height="10"/>`;
      }
      b += '</g>';
    }
    return ['', b];
  },
  sun(r, p) {
    const sy = 110 + r() * 45, R = 78 + r() * 22;
    let m = '';
    for (let i = 0; i < 7; i++) m += `<rect x="0" y="${n1(sy + 6 + i * (R / 7) * 1.05)}" width="300" height="${n1(1 + i * 1.4)}" fill="#000"/>`;
    const d = `<linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient>` +
      `<linearGradient id="su" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p[4]}"/><stop offset=".45" stop-color="${p[3]}"/><stop offset="1" stop-color="${p[2]}"/></linearGradient>` +
      `<mask id="m"><rect width="300" height="300" fill="#fff"/>${m}</mask>`;
    const gy = 228 + r() * 22;
    const ridge = (o, amp) => { let s = `M0 ${n0(gy + o)}`; for (let x = 0; x <= 300; x += 30) s += `L${x} ${n0(gy + o - r() * amp)}`; return s + 'V300H0Z'; };
    const b = `<rect width="300" height="300" fill="url(#sk)"/><circle cx="150" cy="${n0(sy)}" r="${n0(R)}" fill="url(#su)" mask="url(#m)"/>` +
      `<path d="${ridge(0, 50)}" fill="${p[1]}" opacity=".85"/><path d="${ridge(26, 28)}" fill="${p[0]}"/>`;
    return [d, b];
  },
  rings(r, p) {
    const cx = 70 + r() * 160, cy = 70 + r() * 160, dx = (r() - .5) * 9, dy = (r() - .5) * 9;
    let b = `<rect width="300" height="300" fill="${p[0]}"/>`;
    for (let k = 15; k > 0; k--) b += `<circle cx="${n0(cx + k * dx)}" cy="${n0(cy + k * dy)}" r="${k * 22}" fill="${p[1 + k % 4]}"/>`;
    return ['', b + `<circle cx="${n0(cx)}" cy="${n0(cy)}" r="9" fill="${p[0]}"/>`];
  },
  stripes(r, p) {
    const w = 14 + Math.floor(r() * 14), R = 70 + r() * 30;
    let s = '';
    for (let x = -300, k = 0; x < 600; x += w, k++) s += `<rect x="${x}" y="-150" width="${w / 2}" height="600" fill="${p[2 + k % 3]}"/>`;
    const d = `<clipPath id="c"><circle cx="150" cy="150" r="${n0(R)}"/></clipPath>`;
    const b = `<rect width="300" height="300" fill="${p[1]}"/><g transform="rotate(45 150 150)">${s}</g>` +
      `<circle cx="150" cy="150" r="${n0(R + 10)}" fill="${p[0]}"/><g clip-path="url(#c)"><rect width="300" height="300" fill="${p[0]}"/><g transform="rotate(-45 150 150)">${s}</g></g>`;
    return [d, b];
  },
  chart(r, p, o) {
    const d = `<linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p[1]}"/><stop offset="1" stop-color="${p[2]}"/></linearGradient>`;
    let pts = '';
    for (let x = 0; x <= 300; x += 25) pts += `${x},${n0(262 - x * .32 - r() * 36)} `;
    const b = `<rect width="300" height="300" fill="url(#cg)"/><polyline points="${pts}" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="3" stroke-linejoin="round"/>` +
      `<text x="20" y="150" font-family="${FONT}" font-weight="900" font-size="62" fill="#fff" letter-spacing="-3">${esc(o.big)}</text>` +
      `<text x="22" y="184" font-family="${FONT}" font-weight="700" font-size="16" fill="#fff" fill-opacity=".85" letter-spacing="4">${esc(o.small)}</text>${MARK}`;
    return [d, b];
  },
  radar(r) {
    const d = `<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C92000" stop-opacity="0"/><stop offset="1" stop-color="#C92000" stop-opacity=".85"/></linearGradient>`;
    let b = `<rect width="300" height="300" fill="#160604"/>`;
    for (let k = 1; k <= 5; k++) b += `<circle cx="150" cy="150" r="${k * 28}" fill="none" stroke="#fff" stroke-opacity="${(.22 - k * .025).toFixed(3)}" stroke-width="1.2"/>`;
    b += `<path d="M150 150L150 10A140 140 0 0 1 271 80Z" fill="url(#sw)"/><path d="M150 150L271 80" stroke="#ff5a3c" stroke-width="2"/>`;
    for (let i = 0; i < 6; i++) { const a = r() * 6.283, rad = 30 + r() * 105, x = 150 + Math.cos(a) * rad, y = 150 + Math.sin(a) * rad; b += `<circle cx="${n0(x)}" cy="${n0(y)}" r="11" fill="#ff5a3c" opacity=".22"/><circle cx="${n0(x)}" cy="${n0(y)}" r="4" fill="#fff"/>`; }
    b += `<text x="20" y="278" font-family="${FONT}" font-weight="900" font-size="34" fill="#fff" letter-spacing="-1.5">Radar</text>${MARK}`;
    return [d, b];
  },
};

/* Portraits: stylised silhouettes with rim light + halftone */
const BUST = `<ellipse cx="150" cy="128" rx="44" ry="52"/><rect x="132" y="160" width="36" height="50" rx="10"/><path d="M48 300C56 228 98 204 150 204S244 228 252 300Z"/>`;
const HAIR = {
  short: `<path d="M104 120C102 82 124 66 150 66S198 82 196 120C186 98 170 92 150 92S112 98 104 120Z"/>`,
  long: `<path d="M100 128C96 80 122 64 150 64S204 80 200 128L208 236H92Z"/>`,
  afro: `<circle cx="150" cy="106" r="74"/>`,
  bun: `<circle cx="150" cy="60" r="24"/><path d="M106 118C104 84 126 72 150 72S196 84 194 118C184 96 168 90 150 90S114 96 106 118Z"/>`,
  cap: `<path d="M104 112C104 78 126 64 150 64S196 78 196 112Z"/><path d="M190 104H238C238 112 228 118 210 118H190Z"/>`,
  mohawk: `<rect x="140" y="42" width="20" height="54" rx="9"/>`,
  phones: '',
};
const PHONES = c => `<path d="M98 128C98 80 120 60 150 60S202 80 202 128" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round"/><rect x="88" y="112" width="20" height="40" rx="9" fill="${c}"/><rect x="192" y="112" width="20" height="40" rx="9" fill="${c}"/>`;
const SHADES = c => `<g fill="${c}"><rect x="110" y="116" width="36" height="17" rx="7"/><rect x="154" y="116" width="36" height="17" rx="7"/><rect x="144" y="120" width="12" height="4"/></g><path d="M116 120h10" stroke="#fff" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>`;

const ROUTES = { home: viewHome, album: viewAlbum, playlist: viewPlaylist, artist: viewArtist, search: viewSearch, library: viewLibrary };

}

}

  if ((el = t.closest('[data-play]'))) {
    e.preventDefault(); const ctx = el.dataset.play; if (!ctx) return;
    if (S.ctx === ctx && cur()) togglePlay(); else playCtx(ctx, 0);
    return;
  }
  if ((el = t.closest('[data-shuffle-play]'))) {
    const ctx = el.dataset.shufflePlay, n = ctxTracks(ctx).length;
    S.shuffle = true; playCtx(ctx, Math.floor(Math.random() * n)); toast(`${ic('shuffle', 'i-16')}Shuffle play`);
    return;
  }
  if ((el = t.closest('[data-like]'))) { if (el.dataset.like) toggleLike(el.dataset.like); return; }
  if ((el = t.closest('[data-save]'))) { toggleSave(el.dataset.save); return; }
  if ((el = t.closest('[data-follow]'))) { toggleFollow(el.dataset.follow); return; }
  if ((el = t.closest('[data-act]'))) { const f = ACTS[el.dataset.act]; if (f) f(el); return; }
  if ((el = t.closest('[data-more-track]'))) { const r = el.getBoundingClientRect(); openMenu('track', el.dataset.moreTrack, r.left, r.bottom + 6); return; }
  if ((el = t.closest('[data-more-ctx]'))) { const r = el.getBoundingClientRect(); openMenu('ctx', el.dataset.moreCtx, r.left, r.bottom + 6); return; }
  if ((el = t.closest('[data-qidx]'))) { S.idx = Number(el.dataset.qidx); S.pos = 0; S.playing = true; trackChanged(); return; }
  if ((el = t.closest('.tr'))) {
    if (t.closest('a')) return;
    const ctx = el.dataset.ctx;
    if (S.ctx === ctx && S.queue[S.idx] === el.dataset.track) togglePlay(); else playCtx(ctx, Number(el.dataset.idx));
    return;
  }
  if ((el = t.closest('[data-hf]'))) {
    $$('#homePills .pill').forEach(p => p.classList.toggle('on', p === el));
    const k = el.dataset.hf; $('.hf-all').hidden = !!k;
    $$('#view .shelf').forEach(s => { s.hidden = !!k && s.dataset.kind !== k; });
    replay($$('#view .shelf:not([hidden]) .card'));
    return;
  }
  if ((el = t.closest('[data-lv]'))) {
    $$('[data-lv]').forEach(p => p.classList.toggle('on', p === el));
    $$('#libGrid .card').forEach(c => c.classList.toggle('hide', !!el.dataset.lv && c.dataset.kind !== el.dataset.lv));
    replay($$('#libGrid .card:not(.hide)'));
    return;
  }
  if ((el = t.closest('[data-df]'))) {
    $$('[data-df]').forEach(p => p.classList.toggle('on', p === el));
    const k = el.dataset.df;
    $$('#disco .card').forEach(c => c.classList.toggle('hide', k === 'Album' ? c.dataset.type !== 'Album' : k === 'single' ? c.dataset.type === 'Album' : false));
    replay($$('#disco .card:not(.hide)'));
    return;
  }
  if ((el = t.closest('[data-lf]'))) {
    libFilter = libFilter === el.dataset.lf ? '' : el.dataset.lf;
    $$('[data-lf]').forEach(p => p.classList.toggle('on', p.dataset.lf === libFilter));
    renderLib(true);
    return;
  }
  if ((el = t.closest('[data-sf]'))) { searchFilter = el.dataset.sf; renderSearch(); return; }
  if ((el = t.closest('[data-genre]'))) { $('#q').value = el.dataset.genre; searchFilter = ''; renderSearch(); return; }
  if ((el = t.closest('[data-see-more]'))) { const tl = $('.tl', el.parentElement); tl.classList.toggle('expanded'); el.textContent = tl.classList.contains('expanded') ? 'Show less' : 'See more'; return; }
  if ((el = t.closest('.ly'))) { seekTo(Number(el.dataset.t)); return; }
  if ((el = t.closest('[data-href]'))) { if (t.closest('a,button')) return; go(el.dataset.href); }
});

$('#menu').addEventListener('click', e => {
  const b = e.target.closest('[data-m]'), m = $('#menu'), kind = m.dataset.kind, id = m.dataset.id;
  if (b) {
    e.stopPropagation();
    const k = b.dataset.m;
    if (k === 'queue') addToQueue([id]);
    else if (k === 'queue-all') addToQueue(ctxTracks(id));
    else if (k === 'like') toggleLike(id);
    else if (k === 'play') playCtx(id, 0);
    else if (k === 'save') toggleSave(id);
    else if (k === 'follow') toggleFollow(splitCtx(id)[1]);
    else if (k === 'share') copyLink(kind === 'track' ? `#/album/${TR[id].album}` : ctxInfo(id).href);
  }
  closeMenu();
});
document.addEventListener('contextmenu', e => {
  const row = e.target.closest('.tr');
  if (row) { e.preventDefault(); openMenu('track', row.dataset.track, e.clientX, e.clientY); return; }
  const c = e.target.closest('.card[data-ctx],.qp[data-ctx],.lib-item[data-ctx]');
  if (c) { e.preventDefault(); openMenu('ctx', c.dataset.ctx, e.clientX, e.clientY); }
});
$('#fsMore').addEventListener('click', e => { e.stopPropagation(); const t = cur(); if (!t) return; const r = e.currentTarget.getBoundingClientRect(); openMenu('track', t.id, r.right - 260, r.bottom + 6); });
$('#back').addEventListener('click', () => step(-1));
$('#fwd').addEventListener('click', () => step(1));
/* Intercept every in-app link so it never triggers a real page navigation */
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]');
  if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey) return;
  if (innerWidth < 768 && a.closest('#player')) return; // mobile mini player opens full screen instead
  e.preventDefault(); go(a.getAttribute('href'));
}, true);
$('#newPl').addEventListener('click', () => toast('Playlist creation isn’t wired up in this prototype'));
$('#bell').addEventListener('click', () => toast(`${ic('check', 'i-16')}You’re all caught up`));
$('#meBtn').addEventListener('click', () => toast('Signed in as a demo listener'));

function onScroll() {
  const y = $('#scroller').scrollTop, top = $('#topbar');
  top.style.setProperty('--tb-o', clamp(y / 180, 0, 1).toFixed(3));
  top.classList.toggle('show-title', !!tb.title && y > tb.threshold);
}
$('#scroller').addEventListener('scroll', () => { onScroll(); closeMenu(); }, { passive: true });

const q = $('#q');
q.addEventListener('input', () => { searchFilter = ''; if (route().name !== 'search') go('#/search'); else renderSearch(); });
q.addEventListener('focus', () => { if (route().name !== 'search') go('#/search'); });
$('#qClear').addEventListener('click', e => { e.preventDefault(); q.value = ''; searchFilter = ''; renderSearch(); q.focus(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeMenu(); if (fsIsOpen()) closeFS(); return; }
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.getAttribute && e.target.getAttribute('role') === 'slider') return;
  const key = e.key.toLowerCase();
  if (e.key === '/') { e.preventDefault(); if (route().name !== 'search') go('#/search'); else q.focus(); }
  else if (e.code === 'Space' && tag !== 'BUTTON' && tag !== 'A') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); if (e.shiftKey) next(); else seekTo(S.pos + 5); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); if (e.shiftKey) prev(); else seekTo(S.pos - 5); }
  else if (key === 'l' && cur()) toggleLike(cur().id);
  else if (key === 'f') fsIsOpen() ? closeFS() : openFS();
});

/* Swipe the full-screen player down to close it (mobile) */
(function fsDrag() {
  const fs = $('#fs'); let y0 = null, dy = 0;
  const start = e => { if (innerWidth >= 768) return; y0 = e.clientY; dy = 0; fs.classList.add('dragging'); };
  ['#fsTop', '#fsVisual'].forEach(s => $(s).addEventListener('pointerdown', start));
  window.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); fs.style.transform = `translateY(${dy}px)`; });
  window.addEventListener('pointerup', () => {
    if (y0 == null) return;
    fs.classList.remove('dragging'); y0 = null;
    if (dy > 120) closeFS(); else fs.style.transform = '';
  });
})();

/* =====================================================================
   Boot
   ===================================================================== */
function init() {
  $('#me').src = art.me();
  buildViz();
  renderLib(true);
  const seekOpts = {
    get: () => { const t = cur(); return t ? S.pos / t.dur : 0; },
    set: f => { if (!cur()) return; S.dragging = true; S.dragF = f; updateProgress(true); },
    end: f => { S.dragging = false; if (cur()) seekTo(f * cur().dur); },
  };
  slider($('#seek'), seekOpts); slider($('#fsSeek'), seekOpts);
  slider($('#vol'), { get: () => S.muted ? 0 : S.vol, set: f => { S.vol = f; S.muted = f === 0; updateVol(); } });
  updateVol();
  S.ctx = 'album:afterglow-district'; S.queue = ctxTracks(S.ctx); S.idx = 0; S.pos = 42;
  trackChanged();
  if (innerWidth >= 1280) $('#app').classList.add('panel-open');
  syncPanelBtn();
  render();
  window.addEventListener('popstate', () => { const h = safeHash(); if (!h || h === curHash()) return; const k = nav.stack.lastIndexOf(h); if (k >= 0) { nav.i = k; render(); } else go(h); });
  requestAnimationFrame(tick);
  const hide = () => $('#splash').classList.add('done');
  Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]).then(() => setTimeout(hide, 650));
}
init();
</script>
